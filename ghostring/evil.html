<!DOCTYPE html>
<html lang="en">
<head>

  <link href="style.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="ghostring.png">
  <title>👻 Evil Ghostring Sweeper</title>

<body>
<div class="wrap">
